# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Hermes Agent v0.18.0 (Python 3.11+, SQLite 3.35+ FTS5, Telegram Bot API) — no traditional package manager (project is a SKILL.md extension, not a library/app)
  Architecture: Padrino Digital — 12 Hermes skills, 13 bash scripts, SQLite (18 tables + FTS5), 5 cron jobs, GPG-encrypted backups, systemd service, dedicated "padrino" user with security hardening
  Testing: Bash integration test suite (test.sh — 489 lines), static analysis (spec compliance, YAML validation, cross-reference integrity)
  Style: SKILL.md files with YAML frontmatter, bash scripts (set -Eeuo pipefail), SQL with CHECK constraints and triggers
  Git: https://github.com/juantrix-csv/Asistente.git (main)

strict_tdd: false

testing:
  runner: null
  unit: false
  integration: false
  e2e: false
  coverage: false
  linter: null
  type_checker: null
  formatter: null

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
